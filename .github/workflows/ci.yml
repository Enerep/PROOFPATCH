name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test

  browser:
    name: Chromium scenarios
    runs-on: ubuntu-latest
    env:
      PROOFPATCH_BROWSER_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Verify demo with ProofPatch
        id: proofpatch
        run: node bin/proofpatch.js verify --cwd examples/demo --github
      - name: Upload ProofPatch evidence
        id: evidence
        if: ${{ always() && steps.proofpatch.outputs.report-directory != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: proofpatch-demo-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.proofpatch.outputs.report-directory }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Link evidence download
        if: ${{ always() && steps.evidence.outputs.artifact-url != '' }}
        env:
          PROOFPATCH_ARTIFACT_URL: ${{ steps.evidence.outputs.artifact-url }}
        run: |
          printf '\n[Download ProofPatch evidence](%s)\n' "$PROOFPATCH_ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
